<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول وإنشاء حساب | عيادة الابتسامة الذكية لطب الأسنان</title>
  <meta name="description" content="سجل الدخول إلى حسابك في عيادة الابتسامة الذكية لإدارة مواعيدك وسجلك العلاجي، أو أنشئ حساب مريض جديد خلال ثوانٍ.">
  <link rel="canonical" href="http://localhost:3000/login.html">

  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0d9488">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/glass-auth.css">
</head>
<body class="auth-page">
  <div style="position: fixed; top: 1rem; left: 1rem; z-index: 100; display: flex; gap: 0.5rem;">
    <button type="button" id="theme-toggle-btn" onclick="toggleLoginTheme()" class="btn btn-secondary btn-sm" aria-label="تبديل المظهر الليلي والنهاري">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <button type="button" id="lang-toggle-btn" onclick="toggleLoginLang()" class="btn btn-secondary btn-sm">EN</button>
    <a href="/" class="btn btn-secondary btn-sm">الرئيسية</a>
  </div>

  <header class="auth-topbar">
    <div class="container auth-topbar-inner">
      <a href="/" style="display: inline-flex; align-items: center; gap: var(--space-2); font-weight: 700; color: var(--text-primary);">
        <span style="width: 2.25rem; height: 2.25rem; border-radius: var(--radius-md); background-color: #0d9488; color: #ffffff; display: inline-flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path d="M12 5.5c-1.5-1.5-3.8-2.5-6-2.5-3 0-5 2.4-5 5.5 0 3.8 1.9 7 3.1 11 .7 2.4 1.5 4.5 3.1 4.5 1.5 0 2-2.2 2.8-4.7.5-1.7 1.3-2.8 2-2.8s1.5 1.1 2 2.8c.8 2.5 1.3 4.7 2.8 4.7 1.6 0 2.4-2.1 3.1-4.5 1.2-4 3.1-7.2 3.1-11 0-3.1-2-5.5-5-5.5-2.2 0-4.5 1-6 2.5z"/>
          </svg>
        </span>
        <span>عيادة الابتسامة الذكية</span>
      </a>
      <a href="/" class="btn btn-secondary btn-sm">العودة للرئيسية</a>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card animate-enter" aria-labelledby="auth-heading">

      <!-- الطبيب الصغير التفاعلي -->
      <div
        class="mascot-perch-container"
        id="little-doctor-stage"
        role="img"
        aria-label="الطبيب الصغير التفاعلي"
        title="حرك الفأرة أو اضغط للتفاعل مع الطبيب"
      >
        <div class="mascot-aura-ring" aria-hidden="true"></div>
        <div class="mascot-pulse-wave" id="mascot-pulse-wave" aria-hidden="true"></div>

        <svg id="little-doctor-svg" viewBox="0 0 190 154" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="auraGlow" cx="50%" cy="48%" r="50%">
              <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.28"/>
              <stop offset="60%" stop-color="#0d9488" stop-opacity="0.1"/>
              <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="coatGrad" x1="0" y1="0" x2="0.2" y2="1">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="72%" stop-color="#f1f5f9"/>
              <stop offset="100%" stop-color="#cbd5e1"/>
            </linearGradient>
            <linearGradient id="scrubGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#14b8a6"/>
              <stop offset="55%" stop-color="#0d9488"/>
              <stop offset="100%" stop-color="#0f766e"/>
            </linearGradient>
            <linearGradient id="pantsGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0f766e"/>
              <stop offset="100%" stop-color="#115e59"/>
            </linearGradient>
            <radialGradient id="skinGrad" cx="44%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#fff1e6"/>
              <stop offset="68%" stop-color="#fde0cc"/>
              <stop offset="100%" stop-color="#f5bfa0"/>
            </radialGradient>
            <linearGradient id="hairGrad" x1="0" y1="0" x2="0.3" y2="1">
              <stop offset="0%" stop-color="#475569"/>
              <stop offset="50%" stop-color="#1e293b"/>
              <stop offset="100%" stop-color="#0f172a"/>
            </linearGradient>
            <radialGradient id="cheekBlush" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fb7185" stop-opacity="0.48"/>
              <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="seatContactShadow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#0f172a" stop-opacity="0.28"/>
              <stop offset="65%" stop-color="#0f172a" stop-opacity="0.1"/>
              <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- الطبقة الخلفية: الهالة والظل -->
          <circle cx="95" cy="72" r="64" fill="url(#auraGlow)"/>
          <ellipse id="seat-shadow" cx="95" cy="116" rx="40" ry="6.5" fill="url(#seatContactShadow)" opacity="0"/>

          <!-- نجوم وبريق تفاعلي عند المرور أو النجاح -->
          <g id="mascot-sparkles" opacity="0">
            <path d="M36 34 L38 39 L43 41 L38 43 L36 48 L34 43 L29 41 L34 39 Z" fill="#2dd4bf"/>
            <path d="M154 28 L155.5 32 L159.5 33.5 L155.5 35 L154 39 L152.5 35 L148.5 33.5 L152.5 32 Z" fill="#38bdf8"/>
            <circle cx="148" cy="56" r="2.2" fill="#14b8a6"/>
            <circle cx="42" cy="58" r="2" fill="#38bdf8"/>
          </g>

          <!-- مجسم الشخصية الكامل -->
          <g id="doc-whole-body" class="doc-body-entering">

            <!-- الأرجل المتأرجحة بهدوء على حافة البطاقة -->
            <g id="doc-legs-group">
              <g id="doc-leg-left" class="leg-left-seated">
                <rect x="73" y="106" width="13" height="22" rx="6.5" fill="url(#pantsGrad)"/>
                <path d="M69 124 C69 119, 87 119, 87 125 L87 128.5 C87 131, 68 131, 68 128 Z" fill="#1e293b"/>
                <path d="M70 128 L86 128" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
              </g>
              <g id="doc-leg-right" class="leg-right-seated">
                <rect x="104" y="106" width="13" height="22" rx="6.5" fill="url(#pantsGrad)"/>
                <path d="M103 124 C103 119, 121 119, 121 125 L121 128.5 C121 131, 102 131, 102 128 Z" fill="#1e293b"/>
                <path d="M104 128 L120 128" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
              </g>
            </g>

            <!-- الرقبة -->
            <rect x="88" y="64" width="14" height="12" rx="6" fill="#f3be9f"/>

            <!-- الجذع والمعطف الطبي -->
            <g id="doc-torso" style="transform-origin: 95px 112px;">
              <path d="M69 73 L121 73 L125 109 C125 113, 120 115, 114 115 L76 115 C70 115, 65 113, 65 109 Z" fill="url(#scrubGrad)"/>
              <path d="M86 73 L95 86 L104 73" fill="none" stroke="#042f2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

              <!-- الجانب الأيسر من المعطف -->
              <path d="M67 74 C67 70, 79 69, 86 73 L93 115 L65 115 C61 115, 60 110, 62 104 Z" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="1.1"/>
              <path d="M80 72 L87 88 L79 91 L76 76 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>

              <!-- الجانب الأيمن من المعطف -->
              <path d="M123 74 C123 70, 111 69, 104 73 L97 115 L125 115 C129 115, 130 110, 128 104 Z" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="1.1"/>
              <path d="M110 72 L103 88 L111 91 L114 76 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>

              <!-- الجيب والأدوات -->
              <rect x="105" y="93" width="14" height="15" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
              <line x1="109" y1="93" x2="109" y2="86" stroke="#0d9488" stroke-width="2.3" stroke-linecap="round"/>
              <line x1="115" y1="93" x2="116" y2="85" stroke="#64748b" stroke-width="1.7" stroke-linecap="round"/>
              <circle cx="116.3" cy="84.2" r="2.4" fill="#e2e8f0" stroke="#64748b" stroke-width="0.9"/>

              <!-- السماعة الطبية المتأرجحة -->
              <g id="doc-stethoscope" style="transform-origin: 95px 74px;">
                <path d="M81 72 C77 86, 84 95, 95 95 C106 95, 113 86, 109 72" fill="none" stroke="#1e293b" stroke-width="2.6" stroke-linecap="round"/>
                <path d="M95 95 L95 102" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>
                <circle cx="95" cy="104.5" r="4.8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
                <circle cx="95" cy="104.5" r="2" fill="#0d9488"/>
              </g>
            </g>

            <!-- مجموعة الرأس بنظام عمق 2.5D متعدد الطبقات -->
            <g id="doc-head-rig" style="transform-origin: 95px 52px;">
              <!-- طبقة الأذنين والشعر الخلفي (تتحرك عكسياً لخلق عمق الدوران) -->
              <g id="doc-head-back">
                <circle cx="64" cy="46" r="6.5" fill="#f3be9f"/>
                <path d="M63 44 Q61 46 63 48" fill="none" stroke="#d99b7e" stroke-width="1.2" stroke-linecap="round"/>
                <circle cx="126" cy="46" r="6.5" fill="#f3be9f"/>
                <path d="M127 44 Q129 46 127 48" fill="none" stroke="#d99b7e" stroke-width="1.2" stroke-linecap="round"/>
              </g>

              <!-- قاعدة الوجه الناعمة -->
              <rect x="66" y="18" width="58" height="52" rx="26" fill="url(#skinGrad)"/>

              <!-- الشعر العصري والمرآة الطبية -->
              <g id="doc-hair-layer">
                <path d="M65 39 C64 17, 79 9, 96 10 C113 10, 126 20, 125 39 C123 27, 113 22, 103 23 C93 24, 83 19, 74 24 C68 27, 66 33, 65 39 Z" fill="url(#hairGrad)"/>
                <path d="M81 13 Q95 8 109 14" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
                <path d="M67 24 Q95 20 123 24" fill="none" stroke="#475569" stroke-width="2"/>
                <circle cx="95" cy="18" r="7.5" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
                <circle cx="95" cy="18" r="4.3" fill="#ffffff"/>
                <path d="M92.3 15.3 L97.7 20.7" stroke="#38bdf8" stroke-width="1.7" stroke-linecap="round" opacity="0.8"/>
              </g>

              <!-- طبقة الملامح الأمامية (تتحرك بمدى أوسع لإبراز البعد الثالث) -->
              <g id="doc-face-front">
                <g id="doc-brows" style="transition: transform 0.25s ease;">
                  <path id="brow-left" d="M75 34 Q81 31 87 34" fill="none" stroke="#1e293b" stroke-width="2.3" stroke-linecap="round"/>
                  <path id="brow-right" d="M103 34 Q109 31 115 34" fill="none" stroke="#1e293b" stroke-width="2.3" stroke-linecap="round"/>
                </g>

                <g id="doc-eyes-group">
                  <!-- العين اليسرى -->
                  <circle cx="81" cy="43" r="6.8" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/>
                  <g id="pupil-left">
                    <circle cx="81" cy="43" r="3.8" fill="#0f172a"/>
                    <circle cx="81" cy="43" r="2.1" fill="#0d9488" opacity="0.55"/>
                    <circle cx="82.5" cy="41.4" r="1.4" fill="#ffffff"/>
                    <circle cx="79.6" cy="44.3" r="0.65" fill="#ffffff" opacity="0.8"/>
                  </g>
                  <ellipse id="eyelid-left" cx="81" cy="43" rx="7" ry="0" fill="#f6c7ab"/>

                  <!-- العين اليمنى -->
                  <circle cx="109" cy="43" r="6.8" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/>
                  <g id="pupil-right">
                    <circle cx="109" cy="43" r="3.8" fill="#0f172a"/>
                    <circle cx="109" cy="43" r="2.1" fill="#0d9488" opacity="0.55"/>
                    <circle cx="110.5" cy="41.4" r="1.4" fill="#ffffff"/>
                    <circle cx="107.6" cy="44.3" r="0.65" fill="#ffffff" opacity="0.8"/>
                  </g>
                  <ellipse id="eyelid-right" cx="109" cy="43" rx="7" ry="0" fill="#f6c7ab"/>
                </g>

                <!-- الأنف وتورّد الخدين -->
                <path d="M94 46.5 Q95 49.5 96.8 48.5" fill="none" stroke="#d99b7e" stroke-width="1.6" stroke-linecap="round"/>
                <ellipse cx="72" cy="51.5" rx="6" ry="3.5" fill="url(#cheekBlush)"/>
                <ellipse cx="118" cy="51.5" rx="6" ry="3.5" fill="url(#cheekBlush)"/>

                <!-- الفم والابتسامة -->
                <path id="doc-mouth" d="M87.5 55.5 Q95 62 102.5 55.5" fill="none" stroke="#0f172a" stroke-width="2.3" stroke-linecap="round"/>
              </g>
            </g>

            <!-- الطبقة الأمامية: الذراعان واليدان لإخفاء العينين أو التلويح -->
            <g id="doc-arm-left" style="transform-origin: 67px 78px; transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);">
              <path d="M67 78 C56 87, 57 100, 66 105" fill="none" stroke="#ffffff" stroke-width="10.5" stroke-linecap="round"/>
              <path d="M67 78 C56 87, 57 100, 66 105" fill="none" stroke="#cbd5e1" stroke-width="1.3" stroke-linecap="round"/>
              <circle cx="66" cy="105" r="5.4" fill="#fde0cc" stroke="#e5b396" stroke-width="0.9"/>
            </g>

            <g id="doc-arm-right" style="transform-origin: 123px 78px; transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);">
              <path d="M123 78 C134 87, 133 100, 124 105" fill="none" stroke="#ffffff" stroke-width="10.5" stroke-linecap="round"/>
              <path d="M123 78 C134 87, 133 100, 124 105" fill="none" stroke="#cbd5e1" stroke-width="1.3" stroke-linecap="round"/>
              <circle cx="124" cy="105" r="5.4" fill="#fde0cc" stroke="#e5b396" stroke-width="0.9"/>
            </g>

          </g>
        </svg>
      </div>

      <h1 class="auth-title" id="auth-heading">بوابة العيادة الإلكترونية</h1>
      <p class="auth-subtitle" id="auth-subtitle">سجل الدخول لمتابعة مواعيدك وسجلك العلاجي</p>

      <div id="pending-booking-banner" class="alert alert-warning" style="margin-bottom: var(--space-4);" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink: 0; margin-top: 2px;" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>لديك طلب موعد محفوظ؛ سيتم تثبيته تلقائياً فور تسجيل دخولك.</span>
      </div>

      <div class="auth-tabs" role="tablist" aria-label="اختر نوع العملية">
        <button type="button" role="tab" class="auth-tab-btn" id="tab-login" aria-selected="true" aria-controls="panel-login">
          تسجيل الدخول
        </button>
        <button type="button" role="tab" class="auth-tab-btn" id="tab-register" aria-selected="false" aria-controls="panel-register">
          حساب مريض جديد
        </button>
      </div>

      <!-- 1. Login Form Panel -->
      <form id="panel-login" class="auth-panel" role="tabpanel" aria-labelledby="tab-login" novalidate>
        <div class="form-group">
          <label for="login-email" class="form-label">البريد الإلكتروني</label>
          <input type="email" id="login-email" class="form-input track-gaze" autocomplete="email" placeholder="name@example.com" dir="ltr" required>
          <span id="login-email-error" class="form-error-text" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label">كلمة المرور</label>
          <div class="password-field-wrap">
            <input type="password" id="login-password" class="form-input privacy-secret" autocomplete="current-password" placeholder="أدخل كلمة المرور" required>
            <button type="button" class="password-toggle-btn" data-target="login-password" aria-label="إظهار أو إخفاء كلمة المرور">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span id="login-password-error" class="form-error-text" role="alert"></span>
        </div>

        <div class="auth-helper-row">
          <button type="button" id="show-forgot-btn" class="text-link-btn">نسيت كلمة المرور؟</button>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-lg" style="width: 100%;">
          <span>دخول إلى الحساب</span>
        </button>
      </form>

      <!-- 2. Patient Registration Form Panel -->
      <form id="panel-register" class="auth-panel" role="tabpanel" aria-labelledby="tab-register" hidden novalidate>
        <div class="form-group">
          <label for="reg-name" class="form-label">الاسم الكامل</label>
          <input type="text" id="reg-name" class="form-input track-gaze" autocomplete="name" placeholder="أدخل اسمك الثلاثي" required>
          <span id="reg-name-error" class="form-error-text" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="reg-email" class="form-label">البريد الإلكتروني</label>
          <input type="email" id="reg-email" class="form-input track-gaze" autocomplete="email" placeholder="name@example.com" dir="ltr" required>
          <span id="reg-email-error" class="form-error-text" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="reg-phone" class="form-label">رقم الهاتف (اختياري للتذكير بالمواعيد)</label>
          <input type="tel" id="reg-phone" class="form-input track-gaze" autocomplete="tel" placeholder="0790000000" dir="ltr">
        </div>

        <div class="form-group">
          <label for="reg-password" class="form-label">كلمة المرور (6 أحرف على الأقل)</label>
          <div class="password-field-wrap">
            <input type="password" id="reg-password" class="form-input privacy-secret" autocomplete="new-password" placeholder="اختر كلمة مرور قوية" required>
            <button type="button" class="password-toggle-btn" data-target="reg-password" aria-label="إظهار أو إخفاء كلمة المرور">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span id="reg-password-error" class="form-error-text" role="alert"></span>
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-primary btn-lg" style="width: 100%;">
          <span>إنشاء الحساب والمتابعة</span>
        </button>
      </form>

      <!-- 3. Forgot Password Panel -->
      <form id="panel-forgot" class="auth-panel" hidden novalidate>
        <div class="form-group">
          <label for="forgot-email" class="form-label">البريد الإلكتروني المسجل</label>
          <input type="email" id="forgot-email" class="form-input track-gaze" placeholder="name@example.com" dir="ltr" required>
          <span id="forgot-email-error" class="form-error-text" role="alert"></span>
        </div>

        <button type="submit" id="forgot-submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: var(--space-3);">
          <span>إرسال رابط استعادة كلمة المرور</span>
        </button>
        <button type="button" id="back-to-login-btn" class="btn btn-secondary" style="width: 100%;">
          <span>العودة لتسجيل الدخول</span>
        </button>
      </form>

      <!-- 4. Reset Password Panel -->
      <form id="panel-reset" class="auth-panel" hidden novalidate>
        <div class="form-group">
          <label for="reset-new-password" class="form-label">كلمة المرور الجديدة</label>
          <div class="password-field-wrap">
            <input type="password" id="reset-new-password" class="form-input privacy-secret" placeholder="6 أحرف على الأقل" required>
            <button type="button" class="password-toggle-btn" data-target="reset-new-password" aria-label="إظهار أو إخفاء كلمة المرور">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span id="reset-password-error" class="form-error-text" role="alert"></span>
        </div>

        <button type="submit" id="reset-submit-btn" class="btn btn-primary btn-lg" style="width: 100%;">
          <span>حفظ كلمة المرور الجديدة</span>
        </button>
      </form>

      <div class="auth-footer-note">
