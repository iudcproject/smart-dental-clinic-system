<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول وإنشاء حساب | عيادة الابتسامة الذكية لطب الأسنان</title>
  <meta name="description" content="سجل الدخول إلى حسابك في عيادة الابتسامة الذكية لإدارة مواعيدك وسجلك العلاجي، أو أنشئ حساب مريض جديد خلال ثوانٍ.">
  <link rel="canonical" href="http://localhost:3000/login.html">

  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0d9488">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">

  <style>
    /* ============================================================
       1. الخلفية الزجاجية وتنسيق الصفحة العام
       ============================================================ */
    body.auth-page {
      background: radial-gradient(circle at 18% 20%, rgba(13, 148, 136, 0.16), transparent 45%),
                  radial-gradient(circle at 82% 80%, rgba(56, 189, 248, 0.16), transparent 45%),
                  linear-gradient(135deg, #f0fdfa 0%, #f8fafc 50%, #eff6ff 100%) !important;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    .auth-topbar {
      background: rgba(255, 255, 255, 0.65) !important;
      backdrop-filter: blur(18px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(18px) saturate(180%) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.8) !important;
    }

    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7.2rem 1.25rem 3rem;
      position: relative;
    }

    /* ============================================================
       2. بطاقة تسجيل الدخول الزجاجية
       ============================================================ */
    .auth-card {
      position: relative;
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      padding: 3.3rem 2rem 2rem !important;
      border-radius: 24px !important;
      background: rgba(255, 255, 255, 0.7) !important;
      backdrop-filter: blur(22px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(22px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.92) !important;
      box-shadow: 0 22px 55px rgba(15, 23, 42, 0.09) !important;
      overflow: visible !important;
    }

    /* ============================================================
       3. مسرح الطبيب الصغير (يجلس فعلياً على حافة البطاقة العلوية)
       ============================================================ */
    .mascot-perch-container {
      position: absolute;
      top: -102px;
      left: 50%;
      transform: translateX(-50%);
      width: 170px;
      height: 138px;
      z-index: 30;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      background: transparent !important;
      filter: drop-shadow(0 12px 16px rgba(15, 23, 42, 0.14));
    }

    #little-doctor-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      background: transparent !important;
    }

    /* حركات الطبيب المتناغمة */
    @keyframes doctorBreathe {
      0%, 100% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-2px) scaleY(1.012); }
    }

    @keyframes doctorWalkStep {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      25% { transform: translateY(-7px) rotate(0deg); }
      50% { transform: translateY(0px) rotate(3deg); }
      75% { transform: translateY(-7px) rotate(0deg); }
    }

    @keyframes walkLegA {
      0%, 100% { transform: rotate(-18deg) translateY(-2px); }
      50% { transform: rotate(18deg) translateY(0px); }
    }

    @keyframes walkLegB {
      0%, 100% { transform: rotate(18deg) translateY(0px); }
      50% { transform: rotate(-18deg) translateY(-2px); }
    }

    @keyframes seatedLegSwingA {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }

    @keyframes seatedLegSwingB {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }

    .doc-body-walking {
      animation: doctorWalkStep 0.58s ease-in-out infinite;
      transform-origin: 85px 102px;
    }

    .doc-body-seated {
      animation: doctorBreathe 3.4s ease-in-out infinite;
      transform-origin: 85px 102px;
    }

    .leg-left-walk {
      transform-origin: 72px 96px;
      animation: walkLegA 0.58s ease-in-out infinite;
    }
    .leg-right-walk {
      transform-origin: 98px 96px;
      animation: walkLegB 0.58s ease-in-out infinite;
    }

    .leg-left-seated {
      transform-origin: 72px 98px;
      animation: seatedLegSwingA 3.8s ease-in-out infinite;
    }
    .leg-right-seated {
      transform-origin: 98px 98px;
      animation: seatedLegSwingB 3.8s ease-in-out infinite 0.5s;
    }

    /* ============================================================
       4. العناوين، التبويبات، الليبلز، والحقول
       ============================================================ */
    .auth-title {
      text-align: center;
      font-size: 1.5rem !important;
      font-weight: 800 !important;
      color: #0f172a !important;
      margin: 0.25rem 0 0.35rem !important;
      letter-spacing: -0.01em;
    }

    .auth-subtitle {
      text-align: center;
      font-size: 0.9rem !important;
      color: #475569 !important;
      margin: 0 0 1.4rem !important;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
      padding: 0.35rem;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.05) !important;
      border: 1px solid rgba(148, 163, 184, 0.2);
      margin-bottom: 1.35rem;
    }

    .auth-tab-btn {
      padding: 0.6rem 0.75rem !important;
      border-radius: 10px !important;
      font-size: 0.9rem !important;
      font-weight: 700 !important;
      border: 1px solid transparent !important;
      background: transparent !important;
      color: #475569 !important;
      cursor: pointer;
      transition: all 0.25s ease !important;
    }

    .auth-tab-btn[aria-selected="true"] {
      background: rgba(255, 255, 255, 0.94) !important;
      color: #0d9488 !important;
      border-color: rgba(13, 148, 136, 0.25) !important;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06) !important;
    }

    .auth-panel {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
    }

    .form-group {
      margin-bottom: 1.05rem;
      text-align: start;
    }

    .form-label {
      display: block;
      font-size: 0.85rem !important;
      font-weight: 700 !important;
      color: #1e293b !important;
      margin-bottom: 0.42rem !important;
    }

    .form-input {
      width: 100%;
      height: 44px;
      padding: 0.6rem 0.9rem !important;
      font-size: 0.92rem !important;
      border-radius: 12px !important;
      background: rgba(255, 255, 255, 0.84) !important;
      color: #0f172a !important;
      border: 1px solid rgba(148, 163, 184, 0.38) !important;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease !important;
    }

    .form-input:focus {
      background: #ffffff !important;
      border-color: #0d9488 !important;
      box-shadow: 0 0 0 3.5px rgba(13, 148, 136, 0.16) !important;
      outline: none;
    }

    .password-field-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-toggle-btn {
      position: absolute;
      inset-inline-end: 0.6rem;
      background: transparent !important;
      border: none !important;
      color: #64748b !important;
      padding: 0.35rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .password-toggle-btn:hover {
      color: #0d9488 !important;
    }

    .auth-helper-row {
      display: flex;
      justify-content: flex-end;
      margin: -0.35rem 0 1.1rem;
    }

    .text-link-btn {
      background: transparent !important;
      border: none !important;
      color: #0d9488 !important;
      font-size: 0.84rem !important;
      font-weight: 600 !important;
      cursor: pointer;
      padding: 0;
    }
    .text-link-btn:hover {
      text-decoration: underline;
    }

    button[type="submit"],
    .btn-primary {
      height: 46px;
      border-radius: 12px !important;
      font-size: 0.96rem !important;
      font-weight: 700 !important;
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%) !important;
      color: #ffffff !important;
      border: 1px solid rgba(13, 148, 136, 0.45) !important;
      box-shadow: 0 8px 20px rgba(13, 148, 136, 0.25) !important;
      opacity: 1 !important;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease !important;
    }

    button[type="submit"]:hover,
    .btn-primary:hover {
      filter: brightness(1.07);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(13, 148, 136, 0.35) !important;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.82) !important;
      color: #0f172a !important;
      border: 1px solid rgba(148, 163, 184, 0.35) !important;
      font-weight: 700 !important;
      opacity: 1 !important;
    }
    .btn-secondary:hover {
      background: rgba(13, 148, 136, 0.14) !important;
      color: #0d9488 !important;
      border-color: #0d9488 !important;
    }

    .auth-footer-note {
      margin-top: 1.35rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
    }
    .auth-footer-note a {
      color: #0d9488;
      font-weight: 600;
    }

    /* ============================================================
       5. الوضع الليلي الزجاجي الداكن
       ============================================================ */
    .dark-mode body.auth-page {
      background: radial-gradient(circle at 18% 20%, rgba(13, 148, 136, 0.24), transparent 45%),
                  radial-gradient(circle at 82% 80%, rgba(56, 189, 248, 0.16), transparent 45%),
                  linear-gradient(135deg, #070b14 0%, #0f172a 55%, #091322 100%) !important;
    }

    .dark-mode .auth-topbar {
      background: rgba(15, 23, 42, 0.72) !important;
      border-bottom-color: rgba(255, 255, 255, 0.1) !important;
    }

    .dark-mode .auth-card {
      background: rgba(15, 23, 42, 0.7) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.45) !important;
    }

    .dark-mode .auth-title { color: #f8fafc !important; }
    .dark-mode .auth-subtitle { color: #94a3b8 !important; }
    .dark-mode .form-label { color: #e2e8f0 !important; }

    .dark-mode .auth-tabs {
      background: rgba(255, 255, 255, 0.05) !important;
      border-color: rgba(255, 255, 255, 0.1);
    }
    .dark-mode .auth-tab-btn { color: #94a3b8 !important; }
    .dark-mode .auth-tab-btn[aria-selected="true"] {
      background: rgba(45, 212, 191, 0.18) !important;
      color: #2dd4bf !important;
      border-color: rgba(45, 212, 191, 0.35) !important;
    }

    .dark-mode .form-input {
      background: rgba(15, 23, 42, 0.78) !important;
      color: #f8fafc !important;
      border-color: rgba(255, 255, 255, 0.16) !important;
    }
    .dark-mode .form-input:focus {
      border-color: #2dd4bf !important;
      box-shadow: 0 0 0 3.5px rgba(45, 212, 191, 0.2) !important;
    }

    .dark-mode .btn-secondary {
      background: rgba(30, 41, 59, 0.8) !important;
      color: #f8fafc !important;
      border-color: rgba(255, 255, 255, 0.16) !important;
    }
    .dark-mode .btn-secondary:hover {
      background: rgba(45, 212, 191, 0.2) !important;
      color: #5eead4 !important;
      border-color: #2dd4bf !important;
    }
    .dark-mode .text-link-btn,
    .dark-mode .auth-footer-note a { color: #2dd4bf !important; }
  </style>
</head>
<body class="auth-page">
  <div style="position: fixed; top: 1rem; left: 1rem; z-index: 100; display: flex; gap: 0.5rem;">
    <button type="button" id="theme-toggle-btn" onclick="toggleLoginTheme()" class="btn btn-secondary btn-sm">🌙</button>
    <button type="button" id="lang-toggle-btn" onclick="toggleLoginLang()" class="btn btn-secondary btn-sm">EN</button>
    <a href="/" class="btn btn-secondary btn-sm">الرئيسية</a>
  </div>

  <header class="auth-topbar">
    <div class="container auth-topbar-inner">
      <a href="/" style="display: inline-flex; align-items: center; gap: var(--space-2); font-weight: 700; color: var(--text-primary);">
        <span style="width: 2.25rem; height: 2.25rem; border-radius: var(--radius-md); background-color: #0d9488; color: #ffffff; display: inline-flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path d="M12 5.5c-1.5-1.5-3.8-2.5-6-2.5-3 0-5 2.4-5 5.5 0 3.8 1.9 7 3.1 11 .7 2.4 1.5 4.5 3.1 4.5 1.5 0 2-2.2 2.8-4.7.5-1.7 1.3-2.8 2-2.8s1.5 1.1 2 2.8c.8 2.5 1.3 4.7 2.8 4.7 1.6 0 2.4-2.1 3.1-4.5 1.2-4 3.1-7.2 3.1-11 0-3.1-2-5.5-5-5.5-2.2 0-4.5 1-6 2.5z"/>
          </svg>
        </span>
        <span>عيادة الابتسامة الذكية</span>
      </a>
      <a href="/" class="btn btn-secondary btn-sm">العودة للرئيسية</a>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card animate-enter" aria-labelledby="auth-heading">

      <!-- الطبيب الصغير التفاعلي (يجلس بوضوح على حافة البطاقة الزجاجية مع ظل تلامس وساقين متدليتين) -->
      <div
        class="mascot-perch-container"
        id="little-doctor-stage"
        role="img"
        aria-label="الطبيب الصغير التفاعلي"
        title="حرك الفأرة أو اضغط للتفاعل مع الطبيب"
      >
        <svg id="little-doctor-svg" viewBox="0 0 170 142" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="coatGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="75%" stop-color="#f1f5f9"/>
              <stop offset="100%" stop-color="#cbd5e1"/>
            </linearGradient>
            <linearGradient id="coatShadow" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#e2e8f0"/>
              <stop offset="100%" stop-color="#ffffff"/>
            </linearGradient>
            <linearGradient id="scrubGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#14b8a6"/>
              <stop offset="100%" stop-color="#0f766e"/>
            </linearGradient>
            <linearGradient id="pantsGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0f766e"/>
              <stop offset="100%" stop-color="#115e59"/>
            </linearGradient>
            <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fde6d8"/>
              <stop offset="100%" stop-color="#f4bfa4"/>
            </linearGradient>
            <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#334155"/>
              <stop offset="100%" stop-color="#0f172a"/>
            </linearGradient>
            <radialGradient id="seatContactShadow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#0f172a" stop-opacity="0.34"/>
              <stop offset="70%" stop-color="#0f172a" stop-opacity="0.12"/>
              <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- ظل تلامس الجلوس على حافة البطاقة الزجاجية (يظهر عند جلوسه) -->
          <ellipse id="seat-shadow" cx="85" cy="103" rx="34" ry="5.5" fill="url(#seatContactShadow)" opacity="0" style="transition: opacity 0.4s ease;"/>

          <!-- مجموعة الجسم بالكامل -->
          <g id="doc-whole-body" class="doc-body-walking">

            <!-- الساقان المتدليتان على حافة البطاقة (بوضعية جلوس ثلاثية الأبعاد: فخذ أفقي + ركبة مثنية + ساق متدلية) -->
            <g id="doc-legs-group">
              <!-- الساق اليسرى -->
              <g id="doc-leg-left" class="leg-left-walk">
                <!-- الفخذ الجالس على الحافة -->
                <rect x="64" y="92" width="14" height="11" rx="5.5" fill="#115e59"/>
                <!-- الركبة والساق المتدلية للأمام -->
                <rect x="65" y="97" width="12" height="23" rx="6" fill="url(#pantsGrad)"/>
                <!-- خط ثنية البنطال عند الركبة -->
                <path d="M66 101 Q71 103 76 101" fill="none" stroke="#042f2e" stroke-width="1.2" opacity="0.5"/>
                <!-- الحذاء الطبي الأنيق -->
                <path d="M61 117 C61 112, 79 112, 79 118 L79 122 C79 124.5, 60 124.5, 60 121 Z" fill="#1e293b"/>
                <path d="M62 121.5 L78 121.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
                <path d="M67 115 L73 115" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
              </g>

              <!-- الساق اليمنى -->
              <g id="doc-leg-right" class="leg-right-walk">
                <!-- الفخذ الجالس على الحافة -->
                <rect x="92" y="92" width="14" height="11" rx="5.5" fill="#115e59"/>
                <!-- الركبة والساق المتدلية للأمام -->
                <rect x="93" y="97" width="12" height="23" rx="6" fill="url(#pantsGrad)"/>
                <!-- خط ثنية البنطال عند الركبة -->
                <path d="M94 101 Q99 103 104 101" fill="none" stroke="#042f2e" stroke-width="1.2" opacity="0.5"/>
                <!-- الحذاء الطبي الأنيق -->
                <path d="M91 117 C91 112, 109 112, 109 118 L109 122 C109 124.5, 90 124.5, 90 121 Z" fill="#1e293b"/>
                <path d="M92 121.5 L108 121.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
                <path d="M97 115 L103 115" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
              </g>
            </g>

            <!-- الرقبة -->
            <rect x="79" y="55" width="12" height="11" rx="5" fill="#eab396"/>

            <!-- الجذع والمعطف الطبي الغني بالتفاصيل -->
            <g id="doc-torso">
              <!-- القميص الداخلي (Scrubs) -->
              <path d="M62 63 L108 63 L112 97 C112 100, 108 102, 103 102 L67 102 C62 102, 58 100, 58 97 Z" fill="url(#scrubGrad)"/>
              <!-- ياقة V مع ظل -->
              <path d="M77 63 L85 75 L93 63" fill="none" stroke="#042f2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

              <!-- الجزء الأيسر من المعطف الأبيض -->
              <path d="M60 64 C60 60, 71 59, 77 63 L83 102 L58 102 C55 102, 54 98, 55 93 Z" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="1.1"/>
              <!-- طية ياقة المعطف اليسرى -->
              <path d="M72 62 L78 76 L71 79 L68 65 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>

              <!-- الجزء الأيمن من المعطف الأبيض -->
              <path d="M110 64 C110 60, 99 59, 93 63 L87 102 L112 102 C115 102, 116 98, 115 93 Z" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="1.1"/>
              <!-- طية ياقة المعطف اليمنى -->
              <path d="M98 62 L92 76 L99 79 L102 65 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>

              <!-- جيب المعطف مع قلم ومرآة فحص الأسنان -->
              <rect x="94" y="81" width="13" height="14" rx="2.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
              <line x1="98" y1="81" x2="98" y2="75" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round"/>
              <line x1="103" y1="81" x2="104" y2="74" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="104.3" cy="73.5" r="2.2" fill="#e2e8f0" stroke="#64748b" stroke-width="0.8"/>

              <!-- أزرار المعطف -->
              <circle cx="85" cy="84" r="1.6" fill="#94a3b8"/>
              <circle cx="85" cy="93" r="1.6" fill="#94a3b8"/>

              <!-- السماعة الطبية المتدلية حول الرقبة -->
              <g id="doc-stethoscope">
                <path d="M72 62 C69 75, 75 83, 85 83 C95 83, 101 75, 98 62" fill="none" stroke="#1e293b" stroke-width="2.6" stroke-linecap="round"/>
                <path d="M85 83 L85 89" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>
                <circle cx="85" cy="91" r="4.2" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
                <circle cx="85" cy="91" r="1.8" fill="#0d9488"/>
              </g>
            </g>

            <!-- الرأس التفاعلي التفصيلي -->
            <g id="doc-head-rig" style="transform-origin: 85px 46px;">
              <!-- الأذنان مع تفاصيل داخلية -->
              <circle cx="57" cy="40" r="6" fill="#f4bfa4"/>
              <path d="M56 38 Q54 40 56 42" fill="none" stroke="#d99b7e" stroke-width="1.2" stroke-linecap="round"/>
              <circle cx="113" cy="40" r="6" fill="#f4bfa4"/>
              <path d="M114 38 Q116 40 114 42" fill="none" stroke="#d99b7e" stroke-width="1.2" stroke-linecap="round"/>

              <!-- الوجه -->
              <rect x="59" y="15" width="52" height="46" rx="23" fill="url(#skinGrad)"/>

              <!-- الشعر العصري متعدد الطبقات -->

  <!-- محرك الدخول الدرامي البطيء والتفاعلات الغنية للطبيب الصغير -->
  <script>
    (function initLittleDoctorMascot() {
      const stage = document.getElementById('little-doctor-stage');
      const wholeBody = document.getElementById('doc-whole-body');
      const seatShadow = document.getElementById('seat-shadow');
      const legLeft = document.getElementById('doc-leg-left');
      const legRight = document.getElementById('doc-leg-right');
      const headRig = document.getElementById('doc-head-rig');
      const brows = document.getElementById('doc-brows');
      const pupilLeft = document.getElementById('pupil-left');
      const pupilRight = document.getElementById('pupil-right');
      const eyelidLeft = document.getElementById('eyelid-left');
      const eyelidRight = document.getElementById('eyelid-right');
      const armLeft = document.getElementById('doc-arm-left');
      const armRight = document.getElementById('doc-arm-right');
      const mouth = document.getElementById('doc-mouth');

      if (!stage || !headRig) return;

      // 1. الدخول الدرامي البطيء من خارج الشاشة ثم القفز والجلوس فوق حافة البطاقة
      const startOffset = Math.min(window.innerWidth * 0.68, 620);
      const walkDuration = 2600; // 2.6 ثانية مشي درامي متأنٍ
      let startTime = null;
      let isSeated = false;

      // إمالة الجسد قليلاً باتجاه المشي
      stage.style.transform = `translateX(calc(-50% + ${startOffset}px))`;

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function animateDramaticEntrance(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(1, elapsed / walkDuration);
        const eased = easeOutCubic(progress);

        const currentWalkX = startOffset * (1 - eased);
        stage.style.transform = `translateX(calc(-50% + ${currentWalkX}px))`;

        // ينظر باتجاه طريقه أثناء المشي
        targetX = progress < 0.85 ? -0.65 : 0;

        if (progress < 1) {
          requestAnimationFrame(animateDramaticEntrance);
        } else {
          // لحظة الوصول: توقف قصير ثم قفزة درامية للجلوس على حافة البطاقة
          stage.style.transform = 'translateX(-50%)';
          targetX = 0;
          targetY = 0.4;

          setTimeout(() => {
            // قفزة الجلوس فوق الحافة
            wholeBody.classList.remove('doc-body-walking');
            legLeft.classList.remove('leg-left-walk');
            legRight.classList.remove('leg-right-walk');

            wholeBody.animate([
              { transform: 'translateY(0px) scaleY(0.92)' },
              { transform: 'translateY(-18px) scaleY(1.06)' },
              { transform: 'translateY(3px) scaleY(0.95)' },
              { transform: 'translateY(0px) scaleY(1)' }
            ], { duration: 580, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });

            setTimeout(() => {
              isSeated = true;
              wholeBody.classList.add('doc-body-seated');
              legLeft.classList.add('leg-left-seated');
              legRight.classList.add('leg-right-seated');
              if (seatShadow) seatShadow.style.opacity = '1';
              targetY = 0;

              // تلويحة ترحيبية ودودة بعد الجلوس مباشرة
              waveHello();
            }, 520);
          }, 220);
        }
      }

      requestAnimationFrame(animateDramaticEntrance);

      // دالة التلويح الترحيبي باليد
      function waveHello() {
        if (isCoveringEyes) return;
        mouth.setAttribute('d', 'M76 48 Q85 58 94 48');
        brows.style.transform = 'translateY(-2px)';

        armRight.style.transform = 'translate(4px, -24px) rotate(-135deg)';
        setTimeout(() => {
          if (!isCoveringEyes) armRight.style.transform = 'translate(4px, -24px) rotate(-105deg)';
        }, 220);
        setTimeout(() => {
          if (!isCoveringEyes) armRight.style.transform = 'translate(4px, -24px) rotate(-138deg)';
        }, 440);
        setTimeout(() => {
          if (!isCoveringEyes) {
            armRight.style.transform = 'translate(0px, 0px) rotate(0deg)';
            mouth.setAttribute('d', 'M78 49 Q85 55.5 92 49');
            brows.style.transform = 'translateY(0px)';
          }
        }, 720);
      }

      // 2. تتبع حركة مؤشر الفأرة اللحظي بنعومة فيزيائية
      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;
      let isCoveringEyes = false;
      let isPeeking = false;

      window.addEventListener('mousemove', (e) => {
        if (!isSeated) return;
        const rect = stage.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const dx = (e.clientX - centerX) / (window.innerWidth / 2);
        const dy = (e.clientY - centerY) / (window.innerHeight / 2);

        targetX = Math.max(-1, Math.min(1, dx));
        targetY = Math.max(-1, Math.min(1, dy));

        // رفع الحاجبين بلطف عندما يقترب المؤشر من الطبيب
        const dist = Math.hypot(e.clientX - centerX, e.clientY - centerY);
        if (!isCoveringEyes) {
          brows.style.transform = dist < 170 ? 'translateY(-2px)' : 'translateY(0px)';
        }
      });

      // التفاعل مع التبديل بين تبويبي (تسجيل الدخول / حساب مريض جديد)
      document.querySelectorAll('.auth-tab-btn').forEach((tabBtn) => {
        tabBtn.addEventListener('click', () => {
          if (isSeated) waveHello();
        });
      });

      // تتبع الكتابة داخل حقول النص والبريد الإلكتروني
      document.querySelectorAll('.track-gaze').forEach((input) => {
        input.addEventListener('focus', () => {
          uncoverEyes();
          targetY = 0.65;
          brows.style.transform = 'translateY(-1px)';
        });
        input.addEventListener('input', (e) => {
          const len = e.target.value.length;
          const progress = Math.min(1, len / 24);
          targetX = (document.dir === 'rtl' ? 0.5 - progress : progress - 0.5) * 1.35;
          targetY = 0.72;
        });
        input.addEventListener('blur', () => {
          targetY = 0;
          brows.style.transform = 'translateY(0px)';
        });
      });

      // تغطية العينين باحترام عند التركيز على كلمة المرور
      function coverEyes(peek = false) {
        isCoveringEyes = true;
        isPeeking = peek;
        brows.style.transform = 'translateY(-2.5px)';
        if (peek) {
          armLeft.style.transform = 'translate(12px, -48px) rotate(138deg)';
          armRight.style.transform = 'translate(-12px, -40px) rotate(-118deg)';
          mouth.setAttribute('d', 'M80 50 Q85 53 90 50');
        } else {
          armLeft.style.transform = 'translate(13px, -50px) rotate(150deg)';
          armRight.style.transform = 'translate(-13px, -50px) rotate(-150deg)';
          mouth.setAttribute('d', 'M81 50 Q85 48 89 50');
        }
      }

      function uncoverEyes() {
        isCoveringEyes = false;
        isPeeking = false;
        brows.style.transform = 'translateY(0px)';
        armLeft.style.transform = 'translate(0px, 0px) rotate(0deg)';
        armRight.style.transform = 'translate(0px, 0px) rotate(0deg)';
        mouth.setAttribute('d', 'M78 49 Q85 55.5 92 49');
      }

      document.querySelectorAll('.privacy-secret').forEach((pwInput) => {
        pwInput.addEventListener('focus', () => {
          coverEyes(pwInput.type === 'text');
        });
        pwInput.addEventListener('blur', () => {
          setTimeout(() => {
            if (!document.activeElement?.classList.contains('privacy-secret')) {
              uncoverEyes();
            }
          }, 120);
        });
      });

      document.querySelectorAll('.password-toggle-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          setTimeout(() => {
            const targetId = btn.getAttribute('data-target');
            const input = document.getElementById(targetId);
            if (input && document.activeElement === input) {
              coverEyes(input.type === 'text');
            }
          }, 20);
        });
      });

      // التفاعل عند النقر على أزرار الإرسال (هزة رأس متعاطفة إذا وجد خطأ في الإدخال)
      document.querySelectorAll('form').forEach((form) => {
        form.addEventListener('submit', () => {
          setTimeout(() => {
            const hasError = Array.from(form.querySelectorAll('.form-error-text'))
              .some(el => el.textContent.trim().length > 0);
            if (hasError && !isCoveringEyes) {
              mouth.setAttribute('d', 'M80 52 Q85 48 90 52');
              headRig.animate([
                { transform: 'rotate(0deg)' },
                { transform: 'rotate(-9deg)' },
                { transform: 'rotate(9deg)' },
                { transform: 'rotate(-6deg)' },
                { transform: 'rotate(0deg)' }
              ], { duration: 500, easing: 'ease-in-out' });
              setTimeout(() => {
                mouth.setAttribute('d', 'M78 49 Q85 55.5 92 49');
              }, 900);
            }
          }, 80);
        });
      });

      // 3. حلقة التحديث المستمرة (60fps) لتحريك الرأس والبؤبؤين بتناغم
      function updateHeadAndEyes() {
        currentX += (targetX - currentX) * 0.11;
        currentY += (targetY - currentY) * 0.11;

        const headRotate = currentX * 14;
        const headShiftX = currentX * 3.8;
        const headShiftY = currentY * 2.6;

        headRig.style.transform = `translate(${headShiftX}px, ${headShiftY}px) rotate(${headRotate}deg)`;

        const pupilX = currentX * 2.8;
        const pupilY = currentY * 2.3;
        pupilLeft.setAttribute('transform', `translate(${pupilX}, ${pupilY})`);
        pupilRight.setAttribute('transform', `translate(${pupilX}, ${pupilY})`);

        requestAnimationFrame(updateHeadAndEyes);
      }
      requestAnimationFrame(updateHeadAndEyes);

      // 4. رمش تلقائي طبيعي
      setInterval(() => {
        if (isCoveringEyes && !isPeeking) return;
        eyelidLeft.setAttribute('ry', '6.2');
        eyelidRight.setAttribute('ry', '6.2');
        setTimeout(() => {
          eyelidLeft.setAttribute('ry', '0');
          eyelidRight.setAttribute('ry', '0');
        }, 145);
      }, 3600);

      // 5. التفاعل عند النقر على الطبيب نفسه
      stage.addEventListener('click', () => {
        if (!isSeated) return;
        waveHello();
        headRig.animate([
          { transform: 'rotate(0deg)' },
          { transform: 'rotate(-11deg)' },
          { transform: 'rotate(11deg)' },
          { transform: 'rotate(0deg)' }
        ], { duration: 480, easing: 'ease-in-out' });
      });
    })();

    function toggleLoginTheme() {
      const isDark = document.documentElement.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-toggle-btn').textContent = isDark ? '☀️' : '🌙';
    }

    function toggleLoginLang() {
      const current = document.documentElement.lang || 'ar';
      const next = current === 'ar' ? 'en' : 'ar';
      localStorage.setItem('app_lang', next);
      location.reload();
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark-mode');
        document.getElementById('theme-toggle-btn').textContent = '☀️';
      }
      const savedLang = localStorage.getItem('app_lang') || 'ar';
      document.documentElement.lang = savedLang;
      document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('lang-toggle-btn').textContent = savedLang === 'ar' ? 'EN' : 'عربي';
    });
  </script>
</body>
</html>
